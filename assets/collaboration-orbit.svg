<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Collaboration and communication animation</title><desc id="d">Orbiting nodes represent communication, teamwork, adaptability, and problem solving.</desc><defs><linearGradient id="g" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#164e63"/></linearGradient></defs><rect width="1000" height="300" rx="22" fill="url(#g)"/><ellipse cx="500" cy="150" rx="340" ry="100" fill="none" stroke="#38bdf8" stroke-opacity=".45" stroke-width="2" stroke-dasharray="8 10"/><ellipse cx="500" cy="150" rx="220" ry="70" fill="none" stroke="#4ade80" stroke-opacity=".4" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="143" fill="#fff" font-size="30" font-weight="700">BUILD TOGETHER</text><text x="500" y="177" fill="#bae6fd" font-size="17">People skills make great engineering stronger</text><g fill="#0f172a" stroke="#67e8f9" stroke-width="2"><circle cx="170" cy="150" r="48"/><circle cx="830" cy="150" r="48"/><circle cx="500" cy="48" r="38"/><circle cx="500" cy="252" r="38"/></g><g fill="#e0f2fe" font-size="16" font-weight="600"><text x="170" y="155">TEAMWORK</text><text x="830" y="155">LISTENING</text><text x="500" y="54">ADAPT</text><text x="500" y="258">SOLVE</text></g></g><circle r="7" fill="#4ade80"><animateMotion dur="8s" repeatCount="indefinite" path="M160 150 A340 100 0 1 1 840 150 A340 100 0 1 1 160 150"/></circle><circle r="6" fill="#67e8f9"><animateMotion dur="6s" repeatCount="indefinite" path="M280 150 A220 70 0 1 0 720 150 A220 70 0 1 0 280 150"/></circle></svg>