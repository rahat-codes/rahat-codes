<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Animated coding terminal</title><desc id="d">A terminal window animating code lines and a blinking cursor.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172554"/></linearGradient></defs><rect width="1000" height="300" rx="22" fill="url(#b)"/><rect x="22" y="22" width="956" height="256" rx="15" fill="#0b1220" stroke="#334155" stroke-width="2"/><path d="M22 65H978" stroke="#334155"/><circle cx="48" cy="44" r="7" fill="#fb7185"/><circle cx="73" cy="44" r="7" fill="#fbbf24"/><circle cx="98" cy="44" r="7" fill="#4ade80"/><text x="130" y="50" fill="#94a3b8" font-family="monospace" font-size="17">~/rahat-codes — developer terminal</text><g font-family="monospace" font-size="23"><text x="58" y="112" fill="#67e8f9">$</text><text x="86" y="112" fill="#e2e8f0">git commit -m "build something meaningful"</text><text x="58" y="158" fill="#4ade80">✓</text><text x="86" y="158" fill="#cbd5e1">clean code · thoughtful design · tested features</text><text x="58" y="204" fill="#67e8f9">$</text><text x="86" y="204" fill="#e2e8f0">python learn.py --daily</text><text x="58" y="250" fill="#4ade80">→</text><text x="86" y="250" fill="#cbd5e1">build</text><text x="151" y="250" fill="#67e8f9">.</text><text x="165" y="250" fill="#cbd5e1">share</text><text x="225" y="250" fill="#67e8f9">.</text><text x="239" y="250" fill="#cbd5e1">improve</text><rect x="340" y="229" width="13" height="25" fill="#67e8f9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g><path d="M840 100h80M840 130h55M840 160h70" stroke="#22c55e" stroke-width="5" stroke-linecap="round" opacity=".8"><animate attributeName="stroke-dasharray" values="0 100;100 0" dur="3s" repeatCount="indefinite"/></path></svg>