<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Animated AI neural network</title><desc id="d">Glowing connected nodes with moving signal pulses represent applied machine learning and data flow.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="300" rx="22" fill="url(#bg)"/><g stroke="#64748b" stroke-width="2" opacity=".65"><path d="M170 75L420 55L650 100L835 70M170 75L420 150L650 100L835 220M170 225L420 150L650 230L835 220M170 225L420 55L650 230M420 55L420 150L420 245M650 100L650 230"/></g><g fill="#67e8f9" filter="url(#glow)"><circle cx="170" cy="75" r="12"/><circle cx="170" cy="225" r="12"/><circle cx="420" cy="55" r="12"/><circle cx="420" cy="150" r="16"/><circle cx="420" cy="245" r="12"/><circle cx="650" cy="100" r="13"/><circle cx="650" cy="230" r="13"/><circle cx="835" cy="70" r="12"/><circle cx="835" cy="220" r="12"/></g><g fill="#fff" font-family="Arial,sans-serif"><text x="60" y="145" font-size="26" font-weight="700">DATA</text><text x="450" y="145" font-size="20">MODEL</text><text x="875" y="145" font-size="26" font-weight="700">INSIGHT</text></g><g fill="#4ade80"><circle r="7"><animateMotion dur="3s" repeatCount="indefinite" path="M170 75L420 150L650 100L835 70"/></circle><circle r="7"><animateMotion dur="4s" repeatCount="indefinite" path="M170 225L420 150L650 230L835 220"/></circle><circle r="6"><animateMotion dur="3.5s" repeatCount="indefinite" path="M170 75L420 55L650 100L835 220"/></circle></g><text x="500" y="280" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="17">PYTHON  •  DATA PIPELINES  •  MACHINE LEARNING  •  EVALUATION</text></svg>