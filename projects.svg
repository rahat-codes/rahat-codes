<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Selected Projects</title>
  <desc id="desc">Six selected software engineering, mobile development and machine learning projects by Rahat Md Mahadi Hassan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c31"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <style>
      .heading{font:700 29px 'Segoe UI',Arial,sans-serif;fill:#f8fafc;letter-spacing:.4px}
      .sub{font:14px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .num{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#67e8f9;letter-spacing:1.5px}
      .name{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#f1f5f9}
      .desc{font:13px 'Segoe UI',Arial,sans-serif;fill:#a9b8cc}
      .tag{font:11px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
      .link{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#67e8f9;letter-spacing:.5px}
